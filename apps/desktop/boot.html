<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PetLink 启动诊断</title><style>html{background:#FBF6EC}body{border:1px solid #F0E4CE;border-radius:28px;box-shadow:0 12px 36px rgba(180,140,80,.12);font:15px/1.6 "Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:#FFFDF8;color:#5C4A3A;padding:32px;max-width:720px;margin:32px auto}h1{font-size:22px;color:#5C4A3A;background:#FCEBC8;padding:24px;border-radius:24px}ul{padding:0;list-style:none}li{padding:16px 24px;margin:16px 0;background:#FFFDF8;border:1px solid #F0E4CE;border-radius:24px;box-shadow:0 8px 28px #b48c501a;white-space:pre-wrap}li:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#B5AA9A;margin-right:12px}.running:before{background:#F6A8B8;animation:pulse 1s infinite}.success:before{content:"";background:#7fae7a;color:white;width:18px;height:18px;text-align:center;line-height:18px}.failed:before{content:"";background:#D98888;color:white;width:18px;height:18px;text-align:center;line-height:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b75450;background:#fff0ed;padding:16px;border-radius:12px}@keyframes pulse{50%{opacity:.35}}</style><h1>PetLink 正在启动</h1><p>启动失败时请把 boot.log 发回。此窗口将保留诊断信息。</p><ul id="stages"></ul><script>
const labels={data:'准备数据目录',characters:'加载角色',hub:'启动服务',pet:'打开桌宠'};
function render(progress=[]){document.getElementById('stages').replaceChildren(...Object.entries(labels).map(([id,label])=>{const s=progress.find(x=>x.id===id),li=document.createElement('li');li.className=s?.status||'';li.textContent=label+'：'+({running:'进行中',success:'成功',failed:'失败'}[s?.status]||'等待中');if(s?.error){const pre=document.createElement('pre');pre.textContent=s.error;li.append(pre);}return li;}));}window.petlink.onBoot(render);render();
</script></html>
