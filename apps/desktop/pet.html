<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:"><title>PetLink 桌宠</title><style>
:root{--bubble-bg:#FFFDF8;--bubble-text:#5C4A3A;--bubble-border:#F0E4CE;--float-bg:#FFF6F8;--float-text:#D95B78;--float-border:#F6A8B8}
:root[data-theme="mint"]{--bubble-bg:#FAFFFC;--bubble-text:#2F4F42;--bubble-border:#CBE8DC;--float-bg:#EFFAF5;--float-text:#398E71;--float-border:#79CBB0}
:root[data-theme="lavender"]{--bubble-bg:#FDFBFF;--bubble-text:#43385C;--bubble-border:#DFD6F2;--float-bg:#F5F0FF;--float-text:#6E54B5;--float-border:#B29CE8}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}
main{-webkit-app-region:drag;width:100%;height:100%;padding-top:8px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:end;background:transparent;border-radius:24px}
main.click-through{background:transparent}
#bubble{-webkit-app-region:no-drag;position:relative;flex-shrink:0;margin-bottom:8px;background:var(--bubble-bg);color:var(--bubble-text);border:1px solid var(--bubble-border);border-radius:18px;padding:10px 16px;box-shadow:0 5px 18px rgba(180,140,80,.12);font:14px/1.6 "Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;max-width:85%;text-align:center;cursor:grab;z-index:7}
#bubble:after{content:"";position:absolute;bottom:-6px;left:calc(50% - 5px);width:10px;height:10px;background:var(--bubble-bg);border-right:1px solid var(--bubble-border);border-bottom:1px solid var(--bubble-border);transform:rotate(45deg)}
img{-webkit-app-region:no-drag;width:85%;max-height:75%;height:auto;object-fit:contain;object-position:50% 100%;touch-action:none;-webkit-user-drag:none;cursor:grab;z-index:2}
video{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:85%;max-height:75%;height:auto;object-fit:contain;object-position:50% 100%;pointer-events:none;z-index:2}
main.quiet{filter:none}
main.pat img{filter:drop-shadow(0 0 9px #ffd484)}
#float-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.float-badge{position:absolute;padding:3px 10px;border-radius:999px;background:var(--float-bg);color:var(--float-text);border:1px solid var(--float-border);font:700 12px/1.4 "Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 3px 10px rgba(180,100,120,.14);white-space:nowrap;pointer-events:none;animation:petFloatUp .88s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes petFloatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.86)}20%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(.96)}}
</style><main style="position:relative"><div id="float-layer"></div><div id="bubble">陪你歇一会儿</div><video hidden muted playsinline></video><img draggable="false" alt="桌宠"></main><script type="module" src="pet.mjs"></script></html>
